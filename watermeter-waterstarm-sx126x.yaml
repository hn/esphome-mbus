#
# watermeter-waterstarm-sx126x.yaml -- ESPHome config to read WMBUS watermeter via SX126X radio 868 Mhz
#
# Due to hardware restrictions the SX126X can only receive packets with a max length of 255 bytes!
#
# This config is for the Heltec V4 board with 2MB PSRAM (ESP32-S3R2) and 16MB quad (4 data lines) flash:
# https://wiki.heltec.org/docs/devices/open-source-hardware/esp32-series/lora-32/wifi-lora-32-v4/
# https://resource.heltec.cn/download/WiFi_LoRa_32_V4/Schematic/WiFi_LoRa_32_V4.2.pdf
#
#
# WaterStarM M-ETH Q3 2,5 Water Meter,
# marketed by: Brummerhoop
# https://www.brummerhoop.com/media/ce/2a/62/1668505287/1081600001_2019-02-20_ba_waterstar_m_mid_de_en.pdf
# manufactured by: Lorenz GmbH & Co. KG
# technical support by: Engelmann Sensor GmbH
#
# By factory default, the M-ETH watermeter only sends data during the day from 08:00-18:00.
#
# (C) 2026 Hajo Noerenberg
#
# Usage: Flash to Heltec V4 board (ESP32-S3R2)
#
# http://www.noerenberg.de/
# https://github.com/hn/esphome-mbus
#
#
# This program is free software: you can redistribute it and/or modify
# it under the terms of the GNU General Public License version 3.0 as
# published by the Free Software Foundation.
#
# This program is distributed in the hope that it will be useful,
# but WITHOUT ANY WARRANTY; without even the implied warranty of
# MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
# GNU General Public License for more details.
